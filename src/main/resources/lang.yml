# DOCUMENTATION: https://docs.artillex-studios.com/axrankmenu.html

# the %permission% placeholder in the gui will be replaced by these
# this is where you can change their description
# the plugin will auto generate all the used permissions on reloads
# so first configure the config.yml and reload the plugin
permissions:
  "exampleplugin.simple": "This is how you translate a basic permission!"
  "exampleplugin.uses.#": "You can put a # instead of numbers, and they will be replaced!"
  "exampleplugin.admin": "" # set to "" to hide from the gui

reload:
  success: "&#33FF33Plugin successfully reloaded!"
  failed: "&#FF3333Failed to reload the plugin! Something is wrong in the &f%file%&#FF3333 file, look in the console or use a yaml validator to fix the errors!"

buy:
  no-currency: "&#FF3333You don't have enough money to buy this rank!"

requirements:
  not-met: "&#FF3333You do not meet all requirements for this rank. &7(%requirement%)"
  unavailable: "&#FF3333The &f%requirement% &#FF3333requirement is currently unavailable."
  currency-unavailable: "&#FF3333The configured currency is currently unavailable."
  insufficient-currency: "&#FF3333You need more currency. &7(%current%/%required%)"
  insufficient-island: "&#FF3333Your island does not meet this requirement. &7(%current%/%required%)"
  insufficient-playtime: "&#FF3333You need more active playtime. &7(%current%/%required%)"
  insufficient-xp-level: "&#FF3333You do not have enough experience levels. &7(%current%/%required%)"
  insufficient-xp-points: "&#FF3333You do not have enough experience points. &7(%current%/%required%)"
  missing-permission: "&#FF3333You do not meet the permission requirement."
  invalid-group: "&#FF3333You do not meet the group requirement."
  placeholder-unreadable: "&#FF3333A required value could not be read. Please contact an administrator."
  invalid-expression: "&#FF3333A configured requirement expression is invalid."
  invalid-statistic: "&#FF3333The configured playtime statistic is invalid."
  no-island: "&#FF3333You must have an island to purchase this rank."
  superior-unavailable: "&#FF3333The island service is currently unavailable."
  consume-unsupported: "&#FF3333The &f%requirement% &#FF3333requirement cannot be consumed safely."
  consume-failed: "&#FF3333A required resource could not be deducted. Nothing was charged."
  rank-grant-failed: "&#FF3333The rank could not be granted. Nothing was charged."
  rank-grant-rolled-back: "&#FF3333The rank could not be granted and all supported deductions were refunded."
  transaction-in-progress: "&#FFAA33Your previous rank purchase is still being processed."
  success: "&#33FF33You successfully ranked up to &f%rank%&#33FF33."
  status:
    met: "&#33FF33Met"
    not-met: "&#FF3333Not met"

add-rank: "&#33FF33You have added the &f%rank% &#33FF33rank to the gui! &7Now go to the plugins/AxRankMenu/ranks.yml file to edit it!"

error:
  buy-order: "&#FF3333You must buy ranks in order!"
  downgrade-disabled: "&#FF3333You can't downgrade your rank!"

commands:
  invalid-value: "&#FF0000Invalid parameter: &#BB0000%value%"
  invalid-command: "&#FF0000Invalid command or subcommand!"
  missing-argument: "&#FF0000Missing argument! You must specify a value for &#BB0000%value%&#FF0000."
  no-permission: "&#FF0000You don't have permission to access this command!"
  out-of-range: "&#FF0000The &#BB0000%number% &#FF0000must be between &#BB0000%min% &#FF0000and &#BB0000%max%&#FF0000!"
  player-only: "&#FF0000You must be a player to use this command!"
  invalid-player: "&#FF0000The player &#BB0000%player% &#FF0000can not be found!"
  invalid-selector: "&#FF0000You can not use this selector in this command!"

update-notifier: "&#FFEE88There is a new version of AxRankMenu available! &#DDDDDD(&#FFFFFFcurrent: &#FF0000%current% &#DDDDDD| &#FFFFFFlatest: &#00FF00%latest%&#DDDDDD)"

# do not change
version: 6
